<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1> Register Form </h1>
        <form action="RegisterServlet" method="Post">
            <table border align="center">
                <tr>
                    <td> Enter your name : </td>
                    <td><input type="text" name="user_name" placeholder="Enter name"></td>
                </tr>
                <tr>
                    <td> Enter your e-mail : </td>
                    <td><input type="email" name="user_email" placeholder="Enter your email"></td>
                </tr>
                <tr>
                    <td> Enter your Password : </td>
                    <td><input type="password" name="user_password" placeholder="Enter your password"></td>
                </tr>
                <tr>
                    <td> Enter your gender : </td>
                    <td><input type="radio" name="user_gender" value="male">Male &nbsp;&nbsp;&nbsp;&nbsp;</td>
                    <td><input type="radio" name="user_gender" value="female">Female</td>
                </tr>
                <tr>
                    <td> City :</td>
                    <td>
                        <select name="user_city">
                        <option value="Kolkata">Kolkata</option>
                        <option value="Siliguri">Siliguri</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Delhi">Delhi</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><input type="checkbox" value="checked" name="condition"></td>
                    <td> I Agree </td>
                </tr>    
                <tr>
                    <td><button type="Submit">Register</button></td>
                    <td><button type="Reset">Refresh</button></td>
                </tr>
                </table>
        </form>
    </body>
</html>
